<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CrimeWatch Analytics{% endblock %}</title>

  <!-- Fonts: async load so slow CDN never causes blank page -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
  </noscript>

  <!-- Chart.js deferred so it never blocks render -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <style>
    :root {
      --bg:       #0a0f1e;
      --surface:  #111827;
      --surface2: #1e2a3a;
      --border:   #1e3a5f;
      --accent:   #3b82f6;
      --accent2:  #f59e0b;
      --danger:   #ef4444;
      --success:  #10b981;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      /* System font stack fallback — page shows immediately even if Google Fonts is slow */
      --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Courier New', Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); } /* ensures bg color shows immediately */
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--accent); text-decoration: none; }

    /* NAVBAR */
    nav.topnav {
      background: rgba(10,15,30,0.97);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      padding: 0 2rem; height: 60px;
      gap: 2rem;
    }
    .nav-brand { font-size: 1.1rem; font-weight: 700; color: var(--text); display:flex; align-items:center; gap:.5rem;}
    .nav-brand span { color: var(--accent); }
    .nav-links { display: flex; gap: .75rem; margin-left: auto; flex-wrap: nowrap; }
    .nav-links a {
      color: var(--muted); font-size:.85rem; font-weight:500; padding: .25rem .4rem; white-space: nowrap;
      border-radius: 6px; transition: all .2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--surface2); }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .card-sm { padding: 1rem; }

    /* GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    /* BADGES */
    .badge { display: inline-block; padding: .2rem .6rem; border-radius: 99px; font-size: .75rem; font-weight: 600; }
    .badge-red    { background: rgba(239,68,68,.15);  color: #f87171; }
    .badge-orange { background: rgba(249,115,22,.15); color: #fb923c; }
    .badge-yellow { background: rgba(245,158,11,.15); color: #fbbf24; }
    .badge-green  { background: rgba(16,185,129,.15); color: #34d399; }
    .badge-blue   { background: rgba(59,130,246,.15); color: #60a5fa; }
    .badge-gray   { background: rgba(148,163,184,.15);color: #94a3b8; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1.2rem;
           border-radius:8px; font-size:.875rem; font-weight:600; cursor:pointer;
           border:none; transition: all .2s; font-family: var(--font); }
    .btn-primary { background: var(--accent); color:#fff; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }

    /* FORM ELEMENTS */
    select, input[type=text], input[type=number] {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .5rem .75rem; font-family: var(--font); font-size: .875rem;
      width: 100%; outline: none; transition: border-color .2s;
    }
    select:focus, input:focus { border-color: var(--accent); }
    label { font-size: .8rem; font-weight: 600; color: var(--muted); display:block; margin-bottom:.35rem; text-transform:uppercase; letter-spacing:.05em; }

    /* SECTION TITLE */
    .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; }
    .section-title span { color: var(--accent); }

    /* STAT CARDS */
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem 1.5rem; }
    .stat-val { font-size: 2rem; font-weight: 700; color: var(--accent); font-family: var(--mono); }
    .stat-label { font-size: .8rem; color: var(--muted); margin-top: .25rem; text-transform: uppercase; letter-spacing: .06em; }

    /* TABLE */
    .data-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .data-table th { background: var(--surface2); color: var(--muted); padding: .6rem 1rem;
      text-align:left; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; }
    .data-table td { padding: .6rem 1rem; border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: var(--surface2); }

    /* PAGE WRAPPER */
    .page { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* LOADER */
    .loader { display:inline-block; width:18px; height:18px; border:2px solid var(--border);
              border-top-color: var(--accent); border-radius:50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ALERTS */
    .alert { padding: 1rem; border-radius: 8px; font-size: .875rem; border: 1px solid; }
    .alert-info    { background: rgba(59,130,246,.1);  border-color: rgba(59,130,246,.3);  color: #93c5fd; }
    .alert-success { background: rgba(16,185,129,.1);  border-color: rgba(16,185,129,.3);  color: #6ee7b7; }
    .alert-warning { background: rgba(245,158,11,.1);  border-color: rgba(245,158,11,.3);  color: #fcd34d; }
    .alert-danger  { background: rgba(239,68,68,.1);   border-color: rgba(239,68,68,.3);   color: #fca5a5; }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .page { padding: 1rem; }
      .nav-links { gap: .75rem; }
      .nav-links a { font-size: .8rem; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">
    🛡️ CrimeWatch <span>Analytics</span>
  </div>
  <div class="nav-links">
    <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
    <a href="/predictions" class="{% if request.endpoint == 'predictions' %}active{% endif %}">Predict</a>
    <a href="/reports" class="{% if request.endpoint == 'reports' %}active{% endif %}">Reports</a>
    <a href="/data" class="{% if request.endpoint == 'data_page' %}active{% endif %}">Data</a>
    <a href="/about" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
    <a href="/about" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
  </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
